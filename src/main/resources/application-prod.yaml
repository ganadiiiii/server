spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

  jwt:
    secret: ${JWT_SECRET}

  logging:
    file:
      name: /home/ec2-user/hanjum/app.log
    level:
      root: INFO

  flyway:
    enabled: false
    baseline-on-migrate: true