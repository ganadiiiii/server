name: Hanjum Project CI/CD with Gradle

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 소스 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v3

      # JDK 21 설치
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # gradlew 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Gradle 빌드 (테스트는 제외)
      - name: Build with Gradle
        run: ./gradlew build -x test

      # 빌드된 JAR 파일을 EC2 서버로 전송
      - name: Transfer JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ec2-user/hanjum/build/libs"

      # EC2 서버에서 애플리케이션 실행
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          timeout: 120s
          script: |
            # 기존 실행 중인 프로세스 종료 (없으면 무시)
            pgrep -f 'hanjum-0.0.1-SNAPSHOT.jar' | xargs -r kill -9 || true

            # 새로운 애플리케이션 실행 (세션 분리 + 로그 리다이렉트)
            setsid nohup java \
              -Dspring.profiles.active=${{ secrets.SPRING_PROFILES_ACTIVE }} \
              -Ddb.url=${{ secrets.DB_URL }} \
              -Ddb.username=${{ secrets.DB_USERNAME }} \
              -Ddb.password=${{ secrets.DB_PASSWORD }} \
              -Djwt.secret=${{ secrets.JWT_SECRET }} \
              -jar /home/ec2-user/hanjum/build/libs/hanjum-0.0.1-SNAPSHOT.jar \
              > /home/ec2-user/hanjum/app.log 2>&1 < /dev/null &