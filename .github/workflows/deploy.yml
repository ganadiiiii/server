# .github/workflows/deploy.yml

name: Hanjum Project CI/CD with Gradle

# 1. 언제 이 워크플로우를 실행할 것인가?
# main 브랜치에 push 이벤트가 발생했을 때
on:
  push:
    branches: [ "main" ]

# 2. 어떤 작업(Job)들을 수행할 것인가?
jobs:
  build-and-deploy:
    # 3. 어떤 환경에서 실행할 것인가?
    # 최신 우분투 환경에서 실행
    runs-on: ubuntu-latest

    # 4. 세부 실행 단계(Steps)는 무엇인가?
    steps:
      # 소스 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v3

      # JDK 21 설치
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      # gradlew 파일에 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Gradle로 프로젝트 빌드
      # 해커톤에서는 빠른 배포를 위해 '-x test' 옵션으로 테스트를 건너뜁니다.
      - name: Build with Gradle
        run: ./gradlew build -x test

      # 빌드된 JAR 파일을 EC2 서버로 전송
      - name: Transfer JAR to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: "build/libs/*.jar" # 빌드된 JAR 파일 경로
          target: "/home/ubuntu/hanjum" # EC2 서버에 JAR 파일을 저장할 경로

      # EC2 서버에 접속하여 배포 스크립트 실행
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            # 기존에 실행 중인 Java 프로세스 종료
            pgrep -f 'ganadii.*\.jar' | xargs -r kill -9
            
            # 새 애플리케이션을 백그라운드에서 실행 (로그는 app.log에 저장)
            nohup java -jar /home/ubuntu/hanjum/*.jar \
            --spring.datasource.url=${{ secrets.DB_URL }} \
            --spring.datasource.username=${{ secrets.DB_USERNAME }} \
            --spring.datasource.password=${{ secrets.DB_PASSWORD }} \
            --jwt.secret=${{ secrets.JWT_SECRET }} \
            > /home/ubuntu/hanjum/app.log 2>&1 &
